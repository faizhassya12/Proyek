<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Simple</title>

    <!-- Menghubungkan CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <nav>
        <h2>MyWebsite</h2>

        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#about">Tentang</a></li>
            <li><a href="#contact">Kontak</a></li>
        </ul>
    </nav>

    <!-- Halaman Utama -->
    <section id="home" class="hero">
        <h1>Selamat Datang 👋</h1>
        <p>Ini adalah website sederhana pertama saya.</p>

        <button onclick="tampilkanPesan()">Klik Saya</button>
    </section>

    <!-- Tentang -->
    <section id="about" class="about">
        <h2>Tentang Website</h2>
        <p>
            Website ini dibuat menggunakan HTML, CSS, dan JavaScript.
            Cocok untuk belajar membuat website dari dasar.
        </p>
    </section>

    <!-- Kontak -->
    <section id="contact" class="contact">
        <h2>Kontak</h2>
        <p>Email: belajar@example.com</p>
    </section>

    <!-- Menghubungkan JavaScript -->
    <script src="script.js"></script>
</body>
</html>
